<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f2b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=4" />
  <title>دليل الكتب</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">⌁</div>
      <div><p class="eyebrow">LOCAL BOOK GUIDE</p><h1>دليل الكتب</h1></div>
      <button id="settingsButton" class="settings-icon" aria-label="الإعدادات">⚙</button>
    </header>

    <section id="appView" class="view" aria-live="polite"></section>

    <footer><span>● البيانات محفوظة على هذا الجهاز</span><span id="bookCount"></span></footer>
  </main>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="settings-panel">
      <div class="settings-head"><div><p class="eyebrow">LOCAL DATA</p><h2>الإعدادات</h2></div><button id="closeSettings" class="close-button">×</button></div>
      <p class="settings-copy">ارفع ملف Excel أو CSV مرة واحدة. كل صف يتحول تلقائيًا إلى كتاب داخل التصنيف الصحيح.</p>
      <label class="upload-button"><span>رفع بيانات الكتب</span><input id="sheetFile" type="file" accept=".xlsx,.xls,.csv" /></label>
      <div id="sheetInfo" class="file-info">بيانات التجربة المدمجة جاهزة الآن</div>
      <div class="settings-section"><strong>الأعمدة المطلوبة</strong><small>اسم الكتاب · اسم المؤلف · المكان</small></div>
      <button id="resetDemo" class="plain-button">استعادة نماذج التجربة</button>
      <div class="settings-footer"><span id="libraryStats"></span><span>v4</span></div>
    </div>
  </dialog>
  <script src="./vendor/xlsx.full.min.js"></script>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
